[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-chat"
version = "0.1.0"
description = "Chat with GitHub repositories without cloning them"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "mcp>=1.2.0",
]

[project.scripts]
repo-chat = "repo_chat.cli:main"
repo-chat-mcp = "repo_chat.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_chat"]
